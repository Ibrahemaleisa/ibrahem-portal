# Cloudflare Workers config (used by `wrangler deploy` and Workers Builds).
# The static site in ./out is served as Workers Static Assets; worker/index.ts
# only handles /api/*.
name = "ibrahem-portal"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

# Keep variables set in the Cloudflare dashboard when deploying from CI.
keep_vars = true

[assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*"]

[observability]
enabled = true

# Contact settings are NOT stored here. Set them in the dashboard
# (Worker → Settings → Variables and Secrets) or with `wrangler secret put`:
#   RESEND_API_KEY, CONTACT_TO_EMAIL, CONTACT_FROM_EMAIL, TURNSTILE_SECRET_KEY (optional)
# Locally, put them in .dev.vars (see .dev.vars.example).
